name: Tests

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  # ── Python unit tests (no C++ build required) ──────────────────────────
  python-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python package (pure-Python mode)
        working-directory: python
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python tests
        working-directory: python
        run: pytest tests -v --cov=mplus --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: python/coverage.xml

  # ── C++ build (Linux only, ITK 5 from apt) ────────────────────────────
  cpp-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential \
            libinsighttoolkit5-dev \
            libboost-program-options-dev \
            libpng-dev libjpeg-dev libtiff-dev libdcmtk-dev

      - name: Configure
        run: |
          mkdir -p build && cd build
          cmake ../src \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Verify binaries
        run: |
          ls -la build/bin/
          test -f build/bin/3DRegBsplines
          test -f build/bin/3DRegAffine
          test -f build/bin/3DRegAffineMultiLevel

  # ── Lint & type-check ──────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install ruff mypy numpy

      - name: Ruff check
        working-directory: python
        run: ruff check mplus/ tests/

      - name: MyPy (non-strict)
        working-directory: python
        run: mypy mplus/ --ignore-missing-imports || true
