name: Build and publish Docker image on release

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.EM_DOCKERHUB_USERNAME }}
          password: ${{ secrets.EM_DOCKERHUB_TOKEN }}

      - name: Determine image name
        id: image
        env:
          EM_USER: ${{ secrets.EM_DOCKERHUB_USERNAME }}
          EM_REPO: ${{ secrets.MPLUS_DOCKERHUB_REPO }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          if [ -n "$EM_USER" ] && [ -n "$EM_REPO" ]; then
            echo "image=$EM_USER/$EM_REPO" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Docker Hub secrets missing or empty; falling back to $GITHUB_REPO as image name"
            echo "image=$GITHUB_REPO" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.event.release.tag_name }}
            ${{ steps.image.outputs.image }}:latest
